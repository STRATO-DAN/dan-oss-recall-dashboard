name: Rule 3 — no AI attribution

# SKYBIZ, 2026-10-01: keep history clean. Fails a PR if any of its commit messages, its title or its
# description carries an AI/tool-attribution line. Same patterns as STRATO_DAN's
# tools/ci/check-commit-signatures.ts. Master copy of the rule: item 1 of every lane's tag memory.
# Title/body come in through env (never spliced into the script): PR text is untrusted input.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  rule3:
    name: No AI attribution (commits, title, description)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check commit messages, PR title and PR description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^Co-Authored-By:.*(Claude|anthropic)|@anthropic\.com|Generated with \[?Claude Code|claude\.com/claude-code|🤖 Generated with'
          fail=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            hit=$(git log -1 --format=%B "$sha" | grep -niE "$PATTERN" || true)
            if [ -n "$hit" ]; then echo "::error::commit ${sha:0:9} carries an AI-attribution line"; echo "$hit" | sed 's/^/    /'; fail=1; fi
          done
          hit=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -niE "$PATTERN" || true)
          if [ -n "$hit" ]; then echo "::error::PR title/description carries an AI-attribution line"; echo "$hit" | sed 's/^/    /'; fail=1; fi
          if [ "$fail" -ne 0 ]; then
            echo "Fix: edit the title/description; for commits, open a new clean branch + new PR (history keeps old commits)."
            exit 1
          fi
          echo "OK — no AI-attribution line in $(git rev-list --count "$BASE_SHA..$HEAD_SHA") commit(s), title or description."
