name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (free, no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitguardian:
    name: GitGuardian ggshield
    runs-on: ubuntu-latest
    # Requires a real GITGUARDIAN_API_KEY repo secret (Settings → Secrets and variables →
    # Actions) before this job can actually scan — not provisioned yet, so this job is expected
    # to fail/skip until that secret is added. gitleaks above is the real, immediately-working
    # backstop in the meantime; this job isn't a soft no-op, it's an honest "needs setup" gate.
    if: ${{ vars.GITGUARDIAN_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
